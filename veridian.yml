# veridian SystemVerilog LSP config
#
# NOTE: source_dirs/include_dirs only feed the completion + goto-def symbol
# index. They do NOT reach the linters. Cross-file diagnostics come from slang
# (via auto_search_workdir, walks cwd) and from verilator, which is per-file and
# only knows the layout you hand it below in verilator.syntax.args.
source_dirs:
  - src
  - testbench
include_dirs:
  - src

auto_search_workdir: true

